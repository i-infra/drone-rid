name: Deploy lookup site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "site/**"
      - "tools/build_index.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Collapses data/serials.csv.xz + data/faa_uasdoc_map.json into
      # site/index.json (about 1 MB; the page loads it once).
      - run: python3 tools/build_index.py --stats
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
